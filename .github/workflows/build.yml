# Builds
#
# game.love (the game zipped with main.lua at its root, for anyone with LÖVE
# 11.x) and a Windows folder with Portal Pals.exe: the stock LÖVE 11.5 runtime
# with game.love appended, which is LÖVE's own way of fusing a game. Nothing is
# compiled or signed, so Windows SmartScreen asks once ("More info" -> "Run
# anyway"). Tags v* attach both to a GitHub Release.

name: Builds

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LOVE_VERSION: '11.5'
  APP_NAME: Portal Pals

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Package game.love
        run: |
          mkdir -p out
          zip -9 -r out/game.love main.lua conf.lua levels.ldtk lib src -x 'src/shots.lua'

      - name: Fuse with LÖVE for Windows
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLf -o love.zip "https://github.com/love2d/love/releases/download/$LOVE_VERSION/love-$LOVE_VERSION-win64.zip"
          unzip -q love.zip
          dir="$GITHUB_WORKSPACE/out/$APP_NAME (Windows)"
          mkdir -p "$dir"
          cat "love-$LOVE_VERSION-win64/love.exe" "$GITHUB_WORKSPACE/out/game.love" > "$dir/$APP_NAME.exe"
          cp love-$LOVE_VERSION-win64/*.dll love-$LOVE_VERSION-win64/license.txt "$dir/"
          cd "$GITHUB_WORKSPACE/out" && zip -9 -r "$APP_NAME (Windows).zip" "$APP_NAME (Windows)"

      - uses: actions/upload-artifact@v4
        with:
          name: game.love
          path: out/game.love
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }} (Windows)
          path: out/${{ env.APP_NAME }} (Windows)

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/game.love
            out/${{ env.APP_NAME }} (Windows).zip
